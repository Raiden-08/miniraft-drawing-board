<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini-RAFT — Distributed Drawing Board</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="layout">

        <!-- LEFT: Cluster Visualizer -->
        <aside class="panel panel-left">
            <div class="panel-header">
                <span class="panel-title">Cluster</span>
                <span id="cluster-health" class="health-badge">●  Healthy</span>
            </div>

            <!-- Ring topology diagram -->
            <div class="topology-wrap">
                <svg id="topology-svg" viewBox="0 0 260 260" xmlns="http://www.w3.org/2000/svg"></svg>
            </div>

            <!-- Node cards -->
            <div id="nodes-container"></div>
        </aside>

        <!-- CENTER: Canvas -->
        <main class="canvas-wrap">
            <canvas id="drawing-board"></canvas>
            <div id="ws-badge" class="ws-badge connecting">Connecting…</div>
        </main>

        <!-- RIGHT: Chaos + Event log -->
        <aside class="panel panel-right">
            <div class="panel-header">
                <span class="panel-title">Chaos Monkey 🐒</span>
            </div>

            <div class="chaos-legend">
                <span class="legend-item"><span class="dot dot-partition"></span>Partitioned</span>
                <span class="legend-item"><span class="dot dot-slowdown"></span>Slow</span>
                <span class="legend-item"><span class="dot dot-normal"></span>Normal</span>
            </div>

            <div id="chaos-controls"></div>

            <div class="divider"></div>

            <div class="panel-header">
                <span class="panel-title">Event Log</span>
                <button class="btn-small" onclick="document.getElementById('event-log').innerHTML=''">Clear</button>
            </div>
            <div id="event-log" class="event-log"></div>

            <div class="divider"></div>

            <div class="panel-header"><span class="panel-title">Draw</span></div>
            <div class="color-picker" id="color-picker"></div>
            <button class="btn-clear" onclick="clearCanvas()">Clear Canvas (local)</button>
        </aside>
    </div>

    <script src="dashboard.js"></script>
    <script src="canvas.js"></script>
</body>
</html>
